<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MCP Editor · Web MCP Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="32" height="32">
      <h1>MCP <span>Editor</span> <small id="version" class="version"></small></h1>
    </div>
    <div class="top-actions">
      <div class="bridge-chip" id="bridge-chip">
        <i id="bridge-dot" class="dot connecting"></i>
        <span id="bridge-text">Checking…</span>
      </div>
      <button id="bridge-toggle" type="button" class="ghost" disabled><span>Start</span></button>
      <button id="bridge-restart" type="button" class="ghost" disabled><span>Restart</span></button>
    </div>
  </header>

  <p id="banner" class="callout warn" hidden></p>

  <main class="bento">
    <!-- Editor: main tile -->
    <section class="tile tile-editor">
      <div class="toolbar">
        <div class="file">
          <strong>servers.json</strong>
          <small id="path" class="muted"></small>
        </div>
        <div class="toolbar-actions">
          <button id="b-reload" type="button" class="ghost" title="Reload from disk"><span>Reload</span></button>
          <button id="b-format" type="button" class="ghost" title="Sort the JSON"><span>Format</span></button>
          <button id="b-download" type="button" class="ghost" title="Download file"><span>Download</span></button>
          <button id="b-save" type="button" class="primary" disabled><span>Save</span></button>
        </div>
      </div>
      <div class="code">
        <pre id="gutter" aria-hidden="true">1</pre>
        <textarea id="editor" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Contents of servers.json"></textarea>
      </div>
      <div class="statusbar">
        <span id="status" class="status">Loading…</span>
        <span id="dirty" class="muted"></span>
      </div>
      <ul id="issues" class="issues" hidden></ul>
    </section>

    <!-- New MCP -->
    <section class="tile tile-add">
      <h2>New MCP</h2>
      <div id="templates" class="chips" aria-label="Templates"></div>

      <div class="fields">
        <label class="field"><span>Name</span><input id="f-name" type="text" placeholder="my-mcp" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Command</span><input id="f-cmd" type="text" placeholder="python -m my_mcp" autocomplete="off" spellcheck="false"></label>

        <details class="more">
          <summary>Options</summary>
          <div class="fields inner">
            <label class="field"><span>Port</span><input id="f-port" type="number" min="1" max="65535" step="1"></label>
            <label class="field"><span>Folder</span><input id="f-cwd" type="text" placeholder="C:/project" autocomplete="off" spellcheck="false"></label>
            <label class="field"><span>Variables</span><textarea id="f-env" rows="2" spellcheck="false" placeholder="KEY=value"></textarea></label>
          </div>
        </details>
      </div>

      <p id="form-error" class="callout bad" hidden></p>
      <div class="actions">
        <button id="f-add" type="button" class="primary wide"><span>Add</span></button>
        <button id="f-clear" type="button" class="ghost"><span>Clear</span></button>
      </div>
    </section>

    <!-- Import -->
    <section class="tile tile-import">
      <details>
        <summary><h2>Import JSON</h2></summary>
        <div class="fields inner">
          <textarea id="import-text" rows="5" spellcheck="false" placeholder='{ "mcpServers": { … } }'></textarea>
          <p id="import-error" class="callout bad" hidden></p>
          <div class="actions"><button id="import-btn" type="button" class="ghost wide"><span>Import</span></button></div>
        </div>
      </details>
    </section>
  </main>

  <footer class="app-foot"><span id="version-line"></span></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
